// D5-5 module gate: real MySQL, protocol evidence and same-store reopen.
tasks.register('creatorContainerTest', Test) {
    group = 'verification'
    description = 'Verify Creator session, mapping and post-commit in isolated containers.'
    testClassesDirs = sourceSets.careerTest.output.classesDirs
    classpath = sourceSets.careerTest.runtimeClasspath
