name: Performance regression

# Repeats a fixed scenario on a fresh server and checks it against a committed baseline file.
# Baselines are only meaningful on the hardware they were measured on: generate them on this runner
# class (workflow_dispatch with refresh-baseline) and commit the uploaded file.
on:
  schedule:
    - cron: '30 18 * * *' # 03:30 KST, after the Career nightly
  workflow_dispatch:
    inputs:
      refresh-baseline:
        description: Measure a new baseline file and upload it instead of checking
        type: boolean
        default: false

permissions:
  contents: read

env:
  SCENARIO: experiments/concurrency/queue-contention/scenarios/small-buffer.yaml
  BASELINE: experiments/concurrency/queue-contention/baselines/small-buffer.baseline.json
  REPEAT: '7'
  WARMUP: '2'
  TOLERANCE_PCT: '15'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the API jar
        run: ./gradlew bootJar -PskipFrontend
      - name: Start a server with an empty store
        run: |
          java -jar build/libs/engineering-lab-*-SNAPSHOT.jar --server.port=8080 --lab.storage.root="$RUNNER_TEMP/lab" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/experiments > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Measure a baseline
        if: inputs.refresh-baseline || hashFiles(env.BASELINE) == ''
        run: |
          ./gradlew -q lab --args="run $SCENARIO --repeat $REPEAT --warmup $WARMUP --wait --timeout-seconds 900" | tee "$RUNNER_TEMP/series.ndjson"
          series=$(head -1 "$RUNNER_TEMP/series.ndjson" | python3 -c 'import json,sys; print(json.load(sys.stdin)["seriesId"])')
          ./gradlew -q lab --args="baseline $series --export $RUNNER_TEMP/small-buffer.baseline.json"
          echo "::notice::No check ran. Commit the uploaded baseline file to $BASELINE to enable the nightly check."
      - name: Check against the committed baseline
        if: ${{ !inputs.refresh-baseline && hashFiles(env.BASELINE) != '' }}
        # The CLI exits 3 on a regression and 4 when inconclusive; Gradle reports either as a failed task.
        run: ./gradlew -q lab --args="run $SCENARIO --repeat $REPEAT --warmup $WARMUP --wait --timeout-seconds 900 --check-baseline-file $BASELINE --tolerance-pct $TOLERANCE_PCT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: |
            ${{ runner.temp }}/small-buffer.baseline.json
            ${{ runner.temp }}/server.log
          if-no-files-found: ignore
