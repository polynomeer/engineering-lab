spring:
  application:
    name: engineering-lab
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

pipeline:
  queue:
    raw-capacity: 2000
    mapped-capacity: 2000
  threads:
    validator: 4
    inserter: 4
  insert:
    chunk-size: 500
  backpressure:
    offer-timeout-ms: 200

lab:
  observation:
    jvm-enabled: false
    jvm-interval-ms: 0
    max-periodic-samples: 1000
  scenario:
    max-document-bytes: 65536
    max-input-bytes: 52428800
  storage:
    root: .lab
    queue-capacity: 1000
    batch-size: 100
    flush-interval-ms: 1000
    max-attempts: 3
    retry-backoff-ms: 100
    shutdown-timeout-ms: 30000
    page-limit: 500
    preview-limit: 200
    max-active-runs: 8
    git-directory: .
    git-timeout-ms: 2000
