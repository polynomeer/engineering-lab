    include '**/ChecksContainerIntegrationTest.class'
    def manifest = file('career-lab/mcp-platform/build/libs/checks-worker-manifest.json')
    inputs.file(manifest)
    inputs.files(fileTree('career-lab/mcp-platform/build/libs') { include '*-checks-worker.jar' })
    systemProperty 'lab.checks.manifest', manifest.absolutePath
    systemProperty 'lab.checks.evidence', file('build/verification/d5-1').absolutePath
    outputs.upToDateWhen { false }
}

