plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.polynomeer'
version = '0.0.1-SNAPSHOT'
description = 'engineering-lab'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.pnomeer.lab:worker-support:0.1.0'
    implementation 'com.pnomeer.lab:pipeline-support:0.1.0'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.yaml:snakeyaml'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    dependsOn gradle.includedBuild('worker-support').task(':processFixtureJar')
    dependsOn gradle.includedBuild('pipeline-support').task(':test')
    def workerJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'lab.worker.java', workerJava.get().executablePath.asFile.absolutePath
    systemProperty 'lab.worker.fixture', file('career-lab/worker-support/build/libs/worker-support-0.1.0-process-fixture.jar').absolutePath
    useJUnitPlatform()
    systemProperty 'lab.benchmark.classpath', sourceSets.test.runtimeClasspath.asPath
}

tasks.register('generateTestXlsx', JavaExec) {
    group = 'application'
    description = 'Generate a sample XLSX file for ingestion testing.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.pipeline.tools.TestWorkbookGenerator'
}

tasks.register('runBlockingEchoServer', JavaExec) {
    group = 'application'
    description = 'Run the blocking echo server lab.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.lab.experiments.io.BlockingEchoServer'
}

tasks.register('runVirtualThreadEchoServer', JavaExec) {
    group = 'application'
    description = 'Run the virtual-thread echo server lab.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.lab.experiments.io.VirtualThreadEchoServer'
}

tasks.register('runNioSelectorEchoServer', JavaExec) {
    group = 'application'
    description = 'Run the selector-based NIO echo server lab.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.lab.experiments.io.NioSelectorEchoServer'
}

tasks.register('runIoLoadTest', JavaExec) {
    group = 'application'
    description = 'Run the IO lab load-test client. Pass args with --args="host port clients messagesPerClient".'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.lab.experiments.io.LoadTestClient'
}

tasks.register('lab', JavaExec) {
    group = 'application'
    description = 'Validate or submit a JSON/YAML scenario to a running lab server. Use --args="run FILE --wait".'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.lab.cli.LabCli'
}


tasks.register('pipelineBenchmark', JavaExec) {
    group = 'verification'
    description = 'Compare Excel modes in isolated 128 MiB JVMs and retain Run evidence.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pnomeer.lab.experiments.pipeline.benchmark.PipelineBenchmark'
}

// Reuse the exact standalone artifact; default Java builds never invoke Node.
tasks.register('bootDashboardJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    description = 'Package an already-built frontend/dist with the API (run npm run build first).'
    archiveClassifier = 'dashboard'
    targetJavaVersion = tasks.named('bootJar').flatMap { it.targetJavaVersion }
    mainClass = 'com.pnomeer.pipeline.ExcelPipelineApplication'
    classpath = sourceSets.main.runtimeClasspath
    dependsOn classes
    from('frontend/dist') { into 'BOOT-INF/classes/static/app' }
    doFirst {
        if (!file('frontend/dist/index.html').isFile()) {
            throw new GradleException('Missing frontend/dist/index.html; run npm ci and npm run build in frontend first')
        }
    }
}

// Explicit Docker integration suite; run after building the independent Career deployment.
sourceSets {
    careerTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.careerTestImplementation.extendsFrom(configurations.testImplementation)
configurations.careerTestRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)
tasks.register('careerSequenceTest', Test) {
    group = 'verification'
    description = 'Run the actual sequence deployment through the central API (requires Docker and Career build).'
    testClassesDirs = sourceSets.careerTest.output.classesDirs
    classpath = sourceSets.careerTest.runtimeClasspath
    useJUnitPlatform()
    exclude '**/SequenceDaemonRecoveryTest*'
    exclude '**/WorkerContainerIsolationTest*'
    exclude '**/WorkerContainerLifecycleIntegrationTest*'
    exclude '**/ContainerWorkerIntegrationTest*'
    exclude '**/SequenceContainerIntegrationTest*'
    exclude '**/ChecksContainerIntegrationTest*'
    exclude '**/EquityContainerIntegrationTest*'
    exclude '**/MemoryContainerIntegrationTest*'
    exclude '**/MdsContainerIntegrationTest*'
    exclude '**/CreatorContainerIntegrationTest*'
    systemProperty 'lab.worker.java', javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get().executablePath.asFile.absolutePath
    def manifest = file('career-lab/mcp-platform/build/libs/sequence-worker-manifest.json')
    inputs.file(manifest)
    inputs.files(fileTree('career-lab/mcp-platform/build/libs') { include '*-sequence-worker.jar' })
    systemProperty 'lab.sequence.manifest', manifest.absolutePath
    systemProperty 'lab.controller.classpath', sourceSets.careerTest.runtimeClasspath.asPath
    outputs.upToDateWhen { false }
}

// Separate containment proof: cached BusyBox only, no privileged engine or production registration.
tasks.register('workerContainerIsolationTest', Test) {
    group = 'verification'
    description = 'Verify detached process containment and recovery after controller death (requires Docker).'
    testClassesDirs = sourceSets.careerTest.output.classesDirs
    classpath = sourceSets.careerTest.runtimeClasspath
    useJUnitPlatform()
    include '**/WorkerContainerIsolationTest.class'
    include '**/WorkerContainerLifecycleIntegrationTest.class'
    systemProperty 'lab.controller.classpath', sourceSets.careerTest.runtimeClasspath.asPath
    outputs.upToDateWhen { false }
}

// Explicit opt-in: privileged private engine; never part of the normal suites.
tasks.register('careerDaemonRecoveryTest', Test) {
    group = 'verification'
    description = 'Crash/restart a private Docker-in-Docker engine; requires explicit privileged-test opt-in.'
    testClassesDirs = sourceSets.careerTest.output.classesDirs
    classpath = sourceSets.careerTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'lab.daemon.privileged', providers.gradleProperty('labAllowPrivilegedDaemonTest').getOrElse('false')
    include '**/SequenceDaemonRecoveryTest.class'
    systemProperty 'lab.worker.java', javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get().executablePath.asFile.absolutePath
    def manifest = file('career-lab/mcp-platform/build/libs/sequence-worker-manifest.json')
    inputs.file(manifest)
    inputs.files(fileTree('career-lab/mcp-platform/build/libs') { include '*-sequence-worker.jar' })
    systemProperty 'lab.sequence.manifest', manifest.absolutePath
    systemProperty 'lab.controller.classpath', sourceSets.careerTest.runtimeClasspath.asPath
    outputs.upToDateWhen { false }
    doFirst {
        if (providers.gradleProperty('labAllowPrivilegedDaemonTest').orNull != 'true') {
            throw new GradleException('Explicit consent required: -PlabAllowPrivilegedDaemonTest=true creates a privileged private Docker engine')
        }
    }
}

// Protocol/evidence integration in a disposable Java 21 image derived from a cached JRE.
tasks.register('containerWorkerTest', Test) {
    group = 'verification'
    description = 'Verify container worker protocol and central evidence (requires Docker and cached eclipse-temurin:21-jre).'
    dependsOn gradle.includedBuild('worker-support').task(':processFixtureJar')
    testClassesDirs = sourceSets.careerTest.output.classesDirs
    classpath = sourceSets.careerTest.runtimeClasspath
    useJUnitPlatform()
    include '**/ContainerWorkerIntegrationTest.class'
    systemProperty 'lab.worker.fixture', file('career-lab/worker-support/build/libs/worker-support-0.1.0-process-fixture.jar').absolutePath
    outputs.upToDateWhen { false }
}

tasks.register('sequenceContainerTest', Test) {
    group = 'verification'
    description = 'Verify controller-owned MySQL/network and actual Java 21 sequence container worker.'
    testClassesDirs = sourceSets.careerTest.output.classesDirs
    classpath = sourceSets.careerTest.runtimeClasspath
    useJUnitPlatform()
    include '**/SequenceContainerIntegrationTest.class'
    def manifest = file('career-lab/mcp-platform/build/libs/sequence-worker-manifest.json')
    inputs.file(manifest)
    systemProperty 'lab.sequence.manifest', manifest.absolutePath
    systemProperty 'lab.controller.classpath', sourceSets.careerTest.runtimeClasspath.asPath
    outputs.upToDateWhen { false }
}

