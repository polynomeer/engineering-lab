name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  root-test:
    name: Root platform tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle toolchains: 25 for the platform, 21 for worker-support and pipeline-support.
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: root-test-report
          path: build/reports/tests/test/

  frontend:
    name: Dashboard unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npx --yes npm@11.6.0 ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:serve

  e2e:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npx --yes npm@11.6.0 ci
      - run: npx playwright install --with-deps chromium
      # Playwright starts the API on temporary storage and a Vite server (playwright.config.ts).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/test-results/
