name: Career Lab

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  career-lab:
    name: Career modules with Docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Runs alone: root and Career builds share the worker-support build output.
      - run: ./scripts/career-lab.sh test
        env:
          CAREER_LAB_JAVA_HOME: ${{ steps.jdk21.outputs.path }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: career-lab-reports
          path: career-lab/*/build/reports/tests/
