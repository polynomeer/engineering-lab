plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.polynomeer'
version = '0.0.1-SNAPSHOT'
description = 'engineering-lab'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('generateTestXlsx', JavaExec) {
    group = 'application'
    description = 'Generate a sample XLSX file for ingestion testing.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.pipeline.tools.TestWorkbookGenerator'
}

tasks.register('runBlockingEchoServer', JavaExec) {
    group = 'application'
    description = 'Run the blocking echo server lab.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.lab.experiments.io.BlockingEchoServer'
}

tasks.register('runVirtualThreadEchoServer', JavaExec) {
    group = 'application'
    description = 'Run the virtual-thread echo server lab.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.lab.experiments.io.VirtualThreadEchoServer'
}

tasks.register('runNioSelectorEchoServer', JavaExec) {
    group = 'application'
    description = 'Run the selector-based NIO echo server lab.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.lab.experiments.io.NioSelectorEchoServer'
}

tasks.register('runIoLoadTest', JavaExec) {
    group = 'application'
    description = 'Run the IO lab load-test client. Pass args with --args="host port clients messagesPerClient".'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pnomeer.lab.experiments.io.LoadTestClient'
}
