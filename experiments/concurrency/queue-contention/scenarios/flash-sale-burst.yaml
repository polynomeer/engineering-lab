schemaVersion: 1
experiment: concurrency.queue-contention
scenario:
  id: flash-sale-burst
  hypothesis: 소비 용량(소비자 2개, 건당 1ms)이 고정된 상태에서 동시 생산자만 늘리면 처리량은 소비 용량에서 멈추고 생산자 대기만 늘어난다.
parameters:
  queueCapacity: 64
  producerThreads: 2
  consumerThreads: 2
  itemsPerProducer: 300
  consumerDelayMs: 1
measurement:
  mode: SINGLE_PASS
