spring:
  application:
    name: engineering-lab
  servlet:
    multipart:
      file-size-threshold: 0
      max-file-size: 50MB
      max-request-size: 50MB

pipeline:
  shutdown-timeout-ms: 30000
  error-preview-limit: 100
  queue:
    raw-capacity: 2000
    mapped-capacity: 2000
  threads:
    validator: 4
    inserter: 4
  insert:
    chunk-size: 500
    flush-interval-ms: 1000
    max-attempts: 3
    retry-backoff-ms: 100
  backpressure:
    offer-timeout-ms: 200

lab:
  worker-storage:
    max-bytes: 1073741824
    reservation-bytes: 134217728
    max-entries: 100000
  career:
    creator:
      enabled: false
      recover-on-startup: false
      container:
        image-id: ""
        artifact-sha256: ""
        mysql-image-id: ""
        redis-image-id: ""
    mds:
      enabled: false
      recover-on-startup: false
      container:
        image-id: ""
        artifact-sha256: ""
        mysql-image-id: ""
    memory:
      enabled: false
      recover-on-startup: false
      container:
        image-id: ""
        artifact-sha256: ""
        mysql-image-id: ""
    equity:
      enabled: false
      recover-on-startup: false
      container:
        image-id: ""
        artifact-sha256: ""
        mysql-image-id: ""
        redis-image-id: ""
    checks:
      enabled: false
      recover-on-startup: false
      container:
        image-id: ""
        artifact-sha256: ""
    sequence:
      execution-kind: LOCAL_JVM
      container:
        image-id: ""
        artifact-sha256: ""
        mysql-image-id: ""
      enabled: false
      recover-on-startup: false
      manifest: ""
      java-executable: ""
  dashboard:
    redirect-enabled: false
    frontend-origin: ""
  artifacts:
    download:
      max-bytes: 268435456
      max-concurrent: 2
  logs:
    enabled: false
    max-events: 100
    max-bytes: 65536
  jfr:
    enabled: false
    duration-seconds: 60
    max-bytes: 16777216
  trace:
    enabled: false
    max-spans: 1000
  observation:
    jvm-enabled: false
    jvm-interval-ms: 0
    max-periodic-samples: 1000
  scenario:
    max-document-bytes: 65536
    max-input-bytes: 52428800
  storage:
    root: .lab
    queue-capacity: 1000
    batch-size: 100
    flush-interval-ms: 1000
    max-attempts: 3
    retry-backoff-ms: 100
    shutdown-timeout-ms: 30000
    page-limit: 500
    preview-limit: 200
    max-active-runs: 8
    git-directory: .
    git-timeout-ms: 2000
