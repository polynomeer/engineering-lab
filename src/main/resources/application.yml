spring:
  application:
    name: engineering-lab
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

pipeline:
  queue:
    raw-capacity: 2000
    mapped-capacity: 2000
  threads:
    validator: 4
    inserter: 4
  insert:
    chunk-size: 500
    flush-interval-ms: 1000
    max-attempts: 3
    retry-backoff-ms: 100
  backpressure:
    offer-timeout-ms: 200

lab:
  artifacts:
    download:
      max-bytes: 268435456
      max-concurrent: 2
  logs:
    enabled: false
    max-events: 100
    max-bytes: 65536
  jfr:
    enabled: false
    duration-seconds: 60
    max-bytes: 16777216
  trace:
    enabled: false
    max-spans: 1000
  observation:
    jvm-enabled: false
    jvm-interval-ms: 0
    max-periodic-samples: 1000
  scenario:
    max-document-bytes: 65536
    max-input-bytes: 52428800
  storage:
    root: .lab
    queue-capacity: 1000
    batch-size: 100
    flush-interval-ms: 1000
    max-attempts: 3
    retry-backoff-ms: 100
    shutdown-timeout-ms: 30000
    page-limit: 500
    preview-limit: 200
    max-active-runs: 8
    git-directory: .
    git-timeout-ms: 2000
